name: Security Scans

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

# ── CI security policy ────────────────────────────────────────────────────────
# Branch protection must require the `security-policy-gate` job to pass.
# This aggregates all scan results into a single required status check.
# Individual jobs (SAST, container scan, DAST) run in parallel; the gate
# blocks merge if any of them failed.

jobs:
  sast-bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit + Semgrep
        run: pip install bandit semgrep

      - name: Run Bandit
        run: bandit -r scanners/ lineage/ revocation/ cli.py config.py -ll -ii

      - name: Run Semgrep (taint + command injection patterns)
        run: |
          semgrep --config p/python \
                  --config p/command-injection \
                  --error \
                  --quiet \
                  scanners/ lineage/ revocation/ cli.py config.py
        # p/secrets is intentionally excluded: this repo contains credential
        # patterns and demo tokens by design, which would produce false positives.
        continue-on-error: false

  container-scan-trivy:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Build Scanner Image
        run: docker build -t ghostcred:latest -f docker/Dockerfile.scanner .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'ghostcred:latest'
          scanners: 'vuln'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'

  dast-runtime:
    name: DAST Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install flask requests

      - name: Run DAST runtime tests
        # The pytest fixture in test_dast_runtime.py manages the mock provider
        # subprocess internally (scope=module). Do NOT start it separately here
        # to avoid a port-conflict on 5001 that causes the fixture to skip.
        run: pytest tests/test_dast_runtime.py -v --tb=short

  # ── Policy gate ─────────────────────────────────────────────────────────────
  # This is the single job to add to branch protection rules as a required
  # status check. It passes only when ALL scan jobs above pass.
  # Add "security-policy-gate" to: Settings → Branches → Require status checks.
  security-policy-gate:
    name: Security Policy Gate
    runs-on: ubuntu-latest
    needs: [sast-bandit, container-scan-trivy, dast-runtime]
    if: always()   # run even when upstream jobs fail, so we can report clearly
    steps:
      - name: Evaluate policy
        env:
          SAST_RESULT:      ${{ needs.sast-bandit.result }}
          CONTAINER_RESULT: ${{ needs.container-scan-trivy.result }}
          DAST_RESULT:      ${{ needs.dast-runtime.result }}
        run: |
          echo "SAST (Bandit + Semgrep) : $SAST_RESULT"
          echo "Container scan (Trivy)  : $CONTAINER_RESULT"
          echo "DAST runtime tests      : $DAST_RESULT"
          echo ""

          FAILED=0
          [ "$SAST_RESULT"      != "success" ] && { echo "❌ SAST failed";             FAILED=1; }
          [ "$CONTAINER_RESULT" != "success" ] && { echo "❌ Container scan failed";   FAILED=1; }
          [ "$DAST_RESULT"      != "success" ] && { echo "❌ DAST runtime tests failed"; FAILED=1; }

          if [ "$FAILED" -eq 0 ]; then
            echo "✅ All security checks passed — policy gate open."
          else
            echo ""
            echo "🚫 Security policy gate FAILED."
            echo "   All three checks (SAST, container scan, DAST) must pass before merge."
            exit 1
          fi
